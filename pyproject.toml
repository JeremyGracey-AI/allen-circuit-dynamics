[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "allen-circuit-dynamics"
version = "0.1.0"
description = "Shared vs. private population structure and connectivity-constrained dynamics on Allen Institute open Neuropixels data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeremy Gracey" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "pyarrow>=15",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6"]
allen = ["allensdk>=2.16"]

[project.scripts]
acd = "allen_circuit_dynamics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/allen_circuit_dynamics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
