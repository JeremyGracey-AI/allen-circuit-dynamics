[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "allen-circuit-dynamics"
version = "0.2.0"
description = "Shared/private latent-variable models and connectivity-constrained dynamics for simultaneously recorded neural populations, run on open Allen Institute data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeremy Gracey", email = "jeremy.a.gracey@gmail.com" }]
keywords = [
  "neuroscience", "factor-analysis", "latent-variable-models", "neuropixels", "calcium-imaging",
  "communication-subspace", "allen-brain-observatory", "linear-dynamical-systems",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "matplotlib>=3.6",
  "PyYAML>=6",
  "h5py>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6"]
allen = [
  "allensdk>=2.16", "pandas<2.1", "numpy<2", "pynwb>=2.3,<2.6", "hdmf>=3.5,<3.14",
  # Seen on WSL: uv resolved boto3 0.0.3 -> botocore 0.76 -> six 1.7.3 (2014), and dateutil then
  # failed on six.raise_from inside the Mouse Connectivity unionize reader. Keep these modern.
  "boto3>=1.17", "six>=1.16", "python-dateutil>=2.8.2",
]

[project.urls]
Homepage = "https://github.com/JeremyGracey-AI/allen-circuit-dynamics"
Repository = "https://github.com/JeremyGracey-AI/allen-circuit-dynamics"
Issues = "https://github.com/JeremyGracey-AI/allen-circuit-dynamics/issues"
Changelog = "https://github.com/JeremyGracey-AI/allen-circuit-dynamics/blob/main/CHANGELOG.md"

[project.scripts]
acd = "allen_circuit_dynamics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/allen_circuit_dynamics"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "pyproject.toml", "README.md", "CHANGELOG.md", "LICENSE", "CITATION.cff"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode in strings/docstrings (R², λ, −) is intentional

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:launch_testing -p no:launch_pytest"
markers = ["slow: end-to-end synthetic runs (deselect with -m 'not slow')"]
