[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "allen-circuit-dynamics"
version = "0.1.0"
description = "Shared vs. private population structure and connectivity-constrained dynamics on Allen Institute open Neuropixels data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeremy Gracey" }]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "matplotlib>=3.6",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "hypothesis>=6"]
allen = [
  "allensdk>=2.16", "pandas<2.1", "numpy<2", "pynwb>=2.3,<2.6", "hdmf>=3.5,<3.14",
  # Seen on WSL: uv resolved boto3 0.0.3 -> botocore 0.76 -> six 1.7.3 (2014), and dateutil then
  # failed on six.raise_from inside the Mouse Connectivity unionize reader. Keep these modern.
  "boto3>=1.17", "six>=1.16", "python-dateutil>=2.8.2",
]

[project.scripts]
acd = "allen_circuit_dynamics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/allen_circuit_dynamics"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:launch_testing -p no:launch_pytest"
