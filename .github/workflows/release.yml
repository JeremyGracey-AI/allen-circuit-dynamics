name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv build
      - run: |
          uv venv --python 3.12 /tmp/smoke && uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/acd demo --out /tmp/smoke-out | tail -3
          test -f /tmp/smoke-out/latent/metrics.json && test -f /tmp/smoke-out/coupling/metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: write   # GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release with the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ver="${tag#v}"
          awk -v v="$ver" '
            $0 ~ "^## " v " " {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          gh release create "$tag" dist/* --title "$tag" --notes-file notes.md
